[network]
# Seconds to wait for Wi-Fi before starting the fallback hotspot (0-86400).
# 0 starts the hotspot as soon as the adapter is ready and no Wi-Fi is connected.
# An established Wi-Fi connection and a disabled Wi-Fi radio are left alone.
# Default: 60. Restart apertar-network.service after changing this.
hotspot_delay_seconds=60

# Apertar hardware configuration
# Primary location: /home/pi/apertar-hardware.conf
# INA219 I2C bus example: /dev/i2c-4 -> bus=4
# Address can be decimal or hex.
[ina219]
enabled=false
bus=4
address=0x40

[pcf8574]
# Optional I2C GPIO expander for physical buttons.
# Pin actions: none, capture, record_toggle, photo, timelapse, eject,
# fps, fps_up, fps_down, iso, iso_up, iso_down,
# resolution, resolution_up, resolution_down,
# shutter, shutter_up, shutter_down, wb, wb_up, wb_down,
# ev_up, ev_down (1/3 EV steps, clamped to -3..+3), ev0, ev1, ev-1,
# Decimal EV shortcuts also work, e.g. ev-0.7 (rounded to 1/3 EV).
# EV offsets affect auto ISO/shutter only; they do not enable automatic exposure.
# Example: P2=ev-1 or encoder0_cw=ev_up, encoder0_ccw=ev_down.
# still_mode, settings, clip_browser, quick_menu, focus_peaking, zebra,
# false_color, guides, center_marker, grayscale, smpte, external_monitor,
# date_time_overlay, audio_meter
# standby (alias standby_toggle): press to sleep; the next button press wakes only.
# Example: P2=standby or encoder0_press=standby. Put standby last in a group.
# zoom_toggle (aliases: zoom, preview_zoom) uses [display] zoom_toggle_factor.
# run_script (alias: script) launches the Bash file set in [run_script] path.
# Example: P2=zoom_toggle or encoder0_press=zoom_toggle,focus_peaking
# Preview zoom does not change the recorded image; double-tap remains 2x.
# Exact shortcuts are allowed too: iso200, wb5000, fps24, resolution4056x2280,
# shutter180, shutter_angle180, shutter_speed48, shutter1/48.
# Extended still exposure: shutter_s10s=10 seconds, shutter_s0_5s=half a second.
# shutter_s1/48 is an alias for shutter_speed48. Seconds shortcuts require
# Still Mode + Long Exposure for times longer than a frame (sensor limits apply).
# shutter_up/down follow the UI speed list, including 30s..1/15 when enabled:
# up selects a faster shutter; down selects a longer exposure; shutter cycles.
# Up to six comma-separated actions run in order on each press.
# P0=focus_peaking,zebra
# P1=iso200,fps24,wb5000,shutter180
# Spaces around commas are allowed; duplicate actions/aliases run once.
# Toggles flip individually; exact shortcuts always select their stated value.
# Put resolution before FPS, and FPS before shutter-angle shortcuts.
# recindicatorled must be assigned alone, never mixed with button actions.
# Restart apertar-core.service after changing mappings to load them.
# Use recindicatorled on one unused pin to drive a recording LED output.
enabled=false
bus=10
address=0x20
active_low=true
poll_ms=40
debounce_ms=60
pin0=capture
pin1=none
pin2=none
pin3=none
pin4=none
pin5=none
pin6=none
pin7=none

[trigger_output]
# Optional capture trigger pulse for DIY hot shoe, flash sync, tally, or accessories.
# target=gpio uses a Raspberry Pi GPIO line. target=pcf8574 uses a PCF8574 pin.
# For hot-shoe style trigger circuits use an optocoupler/transistor; do not connect flash trigger voltage directly to a Pi GPIO.
enabled=false
target=gpio
events=recording_start,still,timelapse_frame
pulse_ms=80
active_high=true
gpiochip=auto
line=21
open_drain=true
# For target=pcf8574, bus/address default to the [pcf8574] section unless overridden here.
# bus=1
# address=0x20
pcf_pin=0

[recording_indicator]
# Optional recording tally LED on the PCF8574 expander.
# P7 is used here because the LED is physically connected to PCF P7, not Pi GPIO17.
enabled=true
target=gpio
line=21
#bus=10
#address=0x20
#pcf_pin=7
# Active-low wiring: 3.3V -> resistor -> LED positive/anode -> LED negative/cathode -> P7.
# PCF8574 pins sink current best; this is the recommended wiring.
active_high=true

[neorotary4]
# Optional Adafruit NeoRotary 4 / seesaw quad rotary encoder.
# Default address is 0x49. Each encoder has clockwise, counter-clockwise, and press actions.
# Actions use the same names as PCF8574 pins above. Set an action to none to disable it.
# Encoder button examples: iso200, wb5000, fps24, resolution4056x2280.
# A group works here too: encoder0_press=iso200,fps24,wb5000
# Clockwise/counter-clockwise actions also support groups (up to six actions).
enabled=true
bus=1
address=0x49
poll_ms=30
debounce_ms=60
invert_direction=false
reset_on_start=false
max_events_per_poll=8
encoder0_cw=iso_up
encoder0_ccw=iso_down
encoder0_press=iso
encoder1_cw=shutter_up
encoder1_ccw=shutter_down
encoder1_press=shutter
encoder2_cw=wb_up
encoder2_ccw=wb_down
encoder2_press=wb
encoder3_cw=fps_up
encoder3_ccw=fps_down
encoder3_press=resolution

[gpio_buttons]
# Optional direct Raspberry Pi GPIO / Grove digital button inputs.
# Grove digital ports use the BCM number printed on the Grove Base HAT, for example D5 -> d5.
# Button groups use the same syntax: d5=focus_peaking,zebra
# Use d17=recindicatorled to reserve GPIO17 as a recording LED output.
enabled=true
chip=auto
active_low=true
pull=up
poll_ms=12
debounce_ms=60
d10=capture
d6=eject


[gpio_encoders]
# Optional direct GPIO / Grove incremental rotary encoders.
# For Grove Encoder, connect SIGA/SIGB to the two configured digital pins.
# Press/cw/ccw actions support groups: encoder0_press=iso200,fps24,wb5000
enabled=false
chip=auto
active_low=true
pull=up
poll_ms=3
debounce_ms=40
encoder0_a=5
encoder0_b=6
encoder0_cw=iso_up
encoder0_ccw=iso_down
encoder0_press_gpio=13
encoder0_press=iso
encoder0_steps_per_event=4

[grove_analog]
# Optional Grove Base HAT analog controls: potentiometers, sliders, rotary angle sensors.
# ADC address is usually 0x04 on STM32 HATs and 0x08 on newer MM32 HATs.
enabled=false
bus=1
address=0x04
poll_ms=80
deadband=32
emit_on_start=false
a0=wb
a0_min=2500
a0_max=8000
a0_step=50
a1=iso
a1_mode=preset

[imu]
# Current options: driver=mpu6050, bmi160, bmi270, icm42688p.
# Free-running IMUs use sync_offset_ms to bake in a measured Gyroflow sync correction.
enabled=true
driver=mpu6050
sync_mode=free_run
sync_offset_ms=0

[mpu6050]
# Optional gyro/accelerometer sidecar recording for Gyroflow stabilization.
# Enable "Record Gyro Data" in Record settings to write a .gcsv beside each clip.
enabled=true
bus=10
address=0x68
sample_rate_hz=500
gyro_range_dps=1000
accel_range_g=8
dlpf_hz=98
use_fifo=true
fifo_batch_samples=24
# orientation uses Gyroflow axis notation. For chip facing back, X left, Y down, use xYz.
orientation=XYZ
# UI-only neutral level reference. Use Set Level in Gyro Calibration to update these.
level_reference_set=false
level_reference_orientation=XYZ
level_accel_x=0
level_accel_y=0
level_accel_z=0
# Prefer stored/manual bias. Set auto_calibrate_seconds only if the camera is guaranteed still after pressing record.
auto_calibrate_seconds=0
gyro_bias_x=0
gyro_bias_y=0
gyro_bias_z=0
# Optional Gyroflow rolling-shutter metadata. Direction: 0=top-bottom, 1=bottom-top.
frame_readout_time_ms=0
frame_readout_direction=0

[bmi160]
# Direct-polled Bosch BMI160 IMU. Use driver=bmi160 in [imu] to select it.
enabled=false
bus=1
address=0x68
sample_rate_hz=500
gyro_range_dps=1000
accel_range_g=8
use_fifo=false
orientation=XYZ
level_reference_set=false
level_reference_orientation=XYZ
level_accel_x=0
level_accel_y=0
level_accel_z=0
auto_calibrate_seconds=0
gyro_bias_x=0
gyro_bias_y=0
gyro_bias_z=0
frame_readout_time_ms=0
frame_readout_direction=0

[bmi270]
# Direct-polled Bosch BMI270 IMU. Some BMI270 boards need their Bosch config blob initialized by their driver.
enabled=false
bus=1
address=0x68
sample_rate_hz=500
gyro_range_dps=1000
accel_range_g=8
use_fifo=false
orientation=XYZ
level_reference_set=false
level_reference_orientation=XYZ
level_accel_x=0
level_accel_y=0
level_accel_z=0
auto_calibrate_seconds=0
gyro_bias_x=0
gyro_bias_y=0
gyro_bias_z=0
frame_readout_time_ms=0
frame_readout_direction=0

[icm42688p]
# Direct-polled TDK InvenSense ICM42688-P IMU. Use driver=icm42688p in [imu] to select it.
enabled=false
bus=1
address=0x68
sample_rate_hz=500
gyro_range_dps=1000
accel_range_g=8
use_fifo=false
orientation=XYZ
level_reference_set=false
level_reference_orientation=XYZ
level_accel_x=0
level_accel_y=0
level_accel_z=0
auto_calibrate_seconds=0
gyro_bias_x=0
gyro_bias_y=0
gyro_bias_z=0
frame_readout_time_ms=0
frame_readout_direction=0

[cfexpress_hat]
enabled=true
bus=1
address=0x34

[storage]
mount_path=/media/RAW
pcie_controller=1000110000.pcie

[display]
# Resolutions: 720x720(Default), 640x480, 800x480, 1280x720, 1024x600, 1920x1080
# Layouts:
# square (For 720x720)
# landscape_compact (For 640x480 and 800x480)
# landscape_medium (For 1024x600)
# landscape (For 1280x720)
# landscape_large (For 1920x1080)
# ui_rotation values: normal, left, right, upside_down
# Use left/right for native-portrait panels mounted in landscape, for example Raspberry Pi Touch Display 2.
ui_width=1920
ui_height=1080
ui_layout=landscape_large
ui_rotation=normal
controls_opacity=1.0
# Zoom button magnification: 1.0-4.0 (for example 1.5, 2, 3, 4).
# Restart the UI after changing this; pinch zoom keeps its 4x maximum.
zoom_toggle_factor=4.0
windowed=false
hdmi_external_only=true

[run_script]
# BEGIN APERTAR SCRIPT SLOTS
# run_script (alias script) runs all configured scripts in order, up to five.
# Individual slots: P2=run_script1, P3=script2, encoder0_press=run_script3.
# Several on one button: P2=run_script1,run_script3,run_script5.
# Absolute Bash paths, for example /home/pi/scripts/test.sh; unused slots stay empty.
# path is slot 1; path1 is an alias and takes precedence if both exist.
# Runs as pi from each script's directory, without automatic sudo.
# One script at a time in the background. Duplicate pending/running slots are ignored.
# Nonzero exits are logged; later scripts continue. Shutdown cancels pending jobs.
# Path changes apply on the next press; restart Core after editing button mappings.
# END APERTAR SCRIPT SLOTS
path=
path2=
path3=
path4=
path5=
