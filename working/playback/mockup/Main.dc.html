<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip Browser, laptop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 820px; box-sizing: border-box; padding: 24px; background: radial-gradient(120% 72% at 50% -8%, #27272a 0%, #09090b 46%, #000000 100%); color: #f4f4f5; font-family: Inter, 'Segoe UI', sans-serif;">
<div style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 26px 28px 0; border-radius: 32px; border: 1px solid #27272a; background: rgba(9, 9, 11, 0.96); overflow: hidden;">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #9a9aa4;">PLAYBACK</div>
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em;">Clip Browser</h1>
</div>
<div style="display: flex; align-items: center; gap: 10px;">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid #27272a; background: rgba(255, 255, 255, 0.06); color: #f4f4f5; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
Refresh Media
</button>
<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-height: 48px; padding: 4px 20px; border-radius: 999px; border: 1px solid #3fd0ff; background: rgba(63, 208, 255, 0.08); color: #f4f4f5; font-family: inherit; cursor: pointer;">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #79ddff;">SHOW</span>
<span style="font-size: 14px; font-weight: 600;">Clips</span>
</button>
<button type="button" onClick="{{ back }}" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #27272a; background: rgba(255, 255, 255, 0.06); color: #f4f4f5; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
{{ backLabel }}
</button>
</div>
</div>

<div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 0; border-radius: 28px 28px 0 0; border: 1px solid #27272a; border-bottom: none; background: #111113;">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d4d4d8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 4v16"></path><path d="M17 4v16"></path><path d="M3 9h4"></path><path d="M3 15h4"></path><path d="M17 9h4"></path><path d="M17 15h4"></path></svg>
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em;">{{ sectionLabel }}</span>
<button type="button" style="min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #3fd0ff; background: rgba(63, 208, 255, 0.08); color: #79ddff; font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer;">NEWEST FIRST</button>
<span style="flex: 1 1 auto;"></span>
<sc-if value="{{ selecting }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px; align-items: center;">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.14); color: #fca5a5; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg>
Remove Selected
</button>
<button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.9); background: #ffffff; color: #09090b; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Download Selected</button>
<button type="button" onClick="{{ selectAll }}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #27272a; background: rgba(255, 255, 255, 0.06); color: #f4f4f5; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Select All</button>
</div>
</sc-if>
<span style="min-height: 34px; display: flex; align-items: center; padding: 0 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); color: #d4d4d8; font-size: 13px; font-weight: 600;">{{ countText }}</span>
</div>
<div style="font-size: 13px; color: #a1a1aa;">{{ statusText }}</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; overflow: hidden;">
<sc-for list="{{ clips }}" as="c" hint-placeholder-count="8">
<a href="{{ c.href }}" onClick="{{ c.open }}" onPointerDown="{{ c.pressStart }}" onPointerUp="{{ c.pressEnd }}" onPointerLeave="{{ c.pressEnd }}" aria-label="{{ c.label }}" style="{{ c.cardStyle }}">
<div style="{{ c.thumbStyle }}">
<sc-if value="{{ c.noPreview }}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #8e8e98;">NO PREVIEW</span>
</sc-if>
<sc-if value="{{ c.selecting }}" hint-placeholder-val="{{ false }}">
<span style="{{ c.badgeStyle }}">
<sc-if value="{{ c.selected }}" hint-placeholder-val="{{ false }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
</sc-if>
</span>
</sc-if>
<span style="position: absolute; left: 10px; bottom: 10px; padding: 4px 9px; border-radius: 999px; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.12); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #f4f4f5;">{{ c.dur }}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 3px; padding: 0 4px 4px; text-align: left; min-width: 0;">
<span style="font-size: 17px; font-weight: 700; color: #f4f4f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ c.name }}</span>
<span style="font-size: 13px; color: #a1a1aa;">{{ c.fmt }}</span>
<span style="font-size: 12px; color: #8e8e98;">{{ c.date }}</span>
</div>
</a>
</sc-for>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selectionMode":{"editor":"boolean","default":false,"section":"State"},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: ['C0006', 'C0004', 'C0001'], selecting: null, opened: '' };
  }

  clipList() {
    // Placeholder pictures: no real footage in the mockup.
    const pic = (hi, a, b) => 'radial-gradient(70% 60% at ' + hi + ', rgba(255, 236, 214, 0.32), transparent 70%), linear-gradient(160deg, ' + a + ' 0%, ' + b + ' 100%)';
    return [
      { id: 'C0007', dur: '00:10', fmt: 'cDNG clip', date: '28 Oct 2026  14:03', bg: pic('68% 32%', '#46505e', '#121418'), last: true },
      { id: 'C0006', dur: '01:02', fmt: 'cDNG clip', date: '28 Oct 2026  13:51', bg: pic('30% 40%', '#5a4a3c', '#16120f') },
      { id: 'C0005', dur: '00:24', fmt: 'ProRes clip', date: '28 Oct 2026  13:40', bg: pic('52% 22%', '#3b4a44', '#0f1513') },
      { id: 'C0004', dur: '00:41', fmt: 'MLV clip', date: '28 Oct 2026  12:18', bg: pic('80% 60%', '#4a3f52', '#141118') },
      { id: 'C0003', dur: '00:08', fmt: 'cDNG clip', date: '28 Oct 2026  12:02', bg: '', noPreview: true },
      { id: 'C0002', dur: '02:13', fmt: 'H.264 clip', date: '27 Oct 2026  22:41', bg: pic('40% 70%', '#2e3a4f', '#0c0f15') },
      { id: 'C0001', dur: '00:15', fmt: 'cDNG clip', date: '27 Oct 2026  22:30', bg: pic('62% 45%', '#52473d', '#15120f') },
      { id: 'C0000', dur: '00:31', fmt: 'cDNG clip', date: '27 Oct 2026  21:12', bg: pic('20% 30%', '#3d4650', '#101317') },
    ];
  }

  renderVals() {
    const st = this.state;
    const selecting = st.selecting === null ? !!this.props.selectionMode : st.selecting;
    let pressTimer = null;
    const clips = this.clipList().map((c) => {
      const selected = selecting && st.selected.indexOf(c.id) >= 0;
      const toggle = () => {
        const has = st.selected.indexOf(c.id) >= 0;
        this.setState({ selected: has ? st.selected.filter((x) => x !== c.id) : st.selected.concat([c.id]) });
      };
      return {
        name: 'cDNG_26-10-28_' + c.id,
        dur: c.dur, fmt: c.fmt, date: c.date, noPreview: !!c.noPreview, selected, selecting,
        href: selecting ? '#' : 'Viewer.dc.html',
        label: selecting ? (selected ? 'Deselect ' : 'Select ') + 'cDNG_26-10-28_' + c.id : 'Open cDNG_26-10-28_' + c.id,
        open: (e) => { if (selecting) { if (e && e.preventDefault) e.preventDefault(); toggle(); } },
        pressStart: () => { if (!selecting) pressTimer = setTimeout(() => this.setState({ selecting: true, selected: [c.id] }), 800); },
        pressEnd: () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } },
        cardStyle: {
          display: 'flex', flexDirection: 'column', gap: '10px', padding: '10px', borderRadius: '22px', cursor: 'pointer', minWidth: 0, textDecoration: 'none',
          border: selected ? '1px solid rgba(239, 68, 68, 0.7)' : (c.last && !selecting ? '1px solid rgba(255, 255, 255, 0.22)' : '1px solid #27272a'),
          background: selected ? '#241c1f' : (c.last && !selecting ? '#1d1d21' : '#18181b'), color: 'inherit',
        },
        thumbStyle: {
          position: 'relative', aspectRatio: '16 / 9', borderRadius: '18px', overflow: 'hidden',
          background: c.noPreview ? '#171717' : c.bg, border: '1px solid rgba(255, 255, 255, 0.06)',
        },
        badgeStyle: {
          position: 'absolute', top: '10px', left: '10px', width: '28px', height: '28px', borderRadius: '999px', display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: selected ? '#dc2626' : 'rgba(0, 0, 0, 0.55)', border: selected ? '1px solid #f87171' : '1.5px solid rgba(255, 255, 255, 0.75)', boxSizing: 'border-box',
        },
      };
    });
    const n = selecting ? st.selected.length : 12;
    return {
      clips, selecting,
      sectionLabel: selecting ? 'SELECTION' : 'CLIPS',
      countText: selecting ? n + ' selected' : '12 items',
      statusText: selecting ? 'Tap clips to add or remove them. Cancel ends the selection.' : 'Found 12 clip(s) in /media/RAW.',
      backLabel: selecting ? 'Cancel' : 'Back',
      back: () => { if (selecting) this.setState({ selecting: false }); },
      selectAll: () => this.setState({ selected: this.clipList().map((c) => c.id) }),
    };
  }
}
</script>
</body>
</html>
